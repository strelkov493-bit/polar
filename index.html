<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0d1117" />
<title>Polar H10 — пульс</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  .wrap {
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto auto auto 1fr auto;
    gap: 8px;
    padding: 12px;
    max-width: 720px;
    margin: 0 auto;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
  }
  .title { font-weight: 600; font-size: 14px; }
  .status {
    font-size: 11px; padding: 4px 10px; border-radius: 999px;
    background: #21262d; color: #8b949e; white-space: nowrap;
  }
  .status.on   { background: #1f6feb33; color: #58a6ff; }
  .status.err  { background: #f8514933; color: #f85149; }
  .status.wait { background: #d2992233; color: #d29922; }
  .tabs {
    display: flex; gap: 4px;
    background: #161b22; border-radius: 10px; padding: 4px;
    border: 1px solid #30363d;
  }
  .tab {
    flex: 1; padding: 8px 10px; border-radius: 8px;
    text-align: center; font-size: 12px; font-weight: 600;
    color: #8b949e; cursor: pointer; user-select: none;
    transition: background .15s ease, color .15s ease;
  }
  .tab.active { background: #1f6feb; color: #fff; }
  .bpm-row {
    display: flex; align-items: baseline; gap: 8px;
    justify-content: center;
  }
  .bpm {
    font-size: clamp(72px, 26vw, 180px);
    font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: color .25s ease;
    letter-spacing: -2px;
  }
  .bpm.low  { color: #58a6ff; }
  .bpm.ok   { color: #3fb950; }
  .bpm.high { color: #f0883e; }
  .bpm.max  { color: #f85149; }
  .unit { font-size: 16px; color: #8b949e; }
  canvas {
    width: 100%; height: 180px; display: block;
    background: #161b22; border-radius: 12px;
    border: 1px solid #30363d;
  }
  footer {
    display: flex; flex-direction: column; gap: 8px;
    align-items: stretch;
  }
  button {
    font: inherit; font-weight: 600; font-size: 15px;
    padding: 12px 18px; border-radius: 12px; border: none;
    background: #238636; color: #fff; cursor: pointer;
    transition: background .15s ease, transform .05s ease;
  }
  button:active { transform: scale(0.98); }
  button:disabled { background: #21262d; color: #6e7681; cursor: default; }
  button.disconnect { background: #da3633; }
  .zones {
    display: flex; gap: 6px; font-size: 10px; color: #8b949e;
    justify-content: center; flex-wrap: wrap;
  }
  .zones span { padding: 3px 7px; border-radius: 6px; background: #21262d; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">❤️ Polar H10</div>
    <div id="status" class="status wait">инициализация…</div>
  </header>

  <div class="tabs">
    <div id="tabPhone" class="tab">📱 Телефон</div>
    <div id="tabWatch" class="tab">⌚ Часы</div>
  </div>

  <div class="bpm-row">
    <div id="bpm" class="bpm low">--</div>
    <div class="unit">уд/мин</div>
  </div>

  <canvas id="chart"></canvas>

  <footer>
    <button id="connectBtn" class="hidden">Подключить Polar H10</button>
    <div class="zones">
      <span>&lt;100 низкий</span>
      <span>100–140 ок</span>
      <span>140–170 высокий</span>
      <span>&gt;170 макс</span>
    </div>
  </footer>
</div>

<script>
(() => {
  // ═══════════════════════════════════════════════════════════
  //  ⚙️  НАСТРОЙКА
  // ═══════════════════════════════════════════════════════════
  const WS_URL = "wss://polar.richforever.ru:9443";
  // ═══════════════════════════════════════════════════════════

  const MAX_POINTS = 300;
  const MIN_BPM = 40;
  const MAX_BPM = 200;
  const MODE_KEY = "polar_mode";

  const bpmEl    = document.getElementById("bpm");
  const statusEl = document.getElementById("status");
  const btn      = document.getElementById("connectBtn");
  const canvas   = document.getElementById("chart");
  const ctx      = canvas.getContext("2d");
  const tabPhone = document.getElementById("tabPhone");
  const tabWatch = document.getElementById("tabWatch");

  const points = [];

  let mode = localStorage.getItem(MODE_KEY) || "phone";
  let device = null;
  let characteristic = null;
  let isConnected = false;
  let ws = null;
  let wsRetryTimer = null;
  let wakeLock = null;

  // ─── UI helpers ───────────────────────────────────────────

  function zoneClass(bpm) {
    if (bpm < 100) return "low";
    if (bpm < 140) return "ok";
    if (bpm < 170) return "high";
    return "max";
  }

  function setBpm(bpm) {
    bpmEl.textContent = String(bpm);
    bpmEl.className = "bpm " + zoneClass(bpm);
  }

  function setStatus(text, cls = "") {
    statusEl.textContent = text;
    statusEl.className = "status " + cls;
  }

  function applyModeUI() {
    if (mode === "phone") {
      tabPhone.classList.add("active");
      tabWatch.classList.remove("active");
      btn.classList.remove("hidden");
      if (isConnected) {
        setStatus("подключено: " + (device?.name || "H10"), "on");
      } else {
        setStatus("готово к подключению", "");
      }
    } else {
      tabWatch.classList.add("active");
      tabPhone.classList.remove("active");
      btn.classList.add("hidden");
      setStatus("ожидание сервера…", "wait");
    }
  }

  function setMode(newMode) {
    if (mode === newMode) return;
    mode = newMode;
    localStorage.setItem(MODE_KEY, mode);
    if (mode === "watch" && isConnected) disconnectBluetooth();
    points.length = 0;
    bpmEl.textContent = "--";
    bpmEl.className = "bpm low";
    draw();
    applyModeUI();
  }

  tabPhone.addEventListener("click", () => setMode("phone"));
  tabWatch.addEventListener("click", () => setMode("watch"));

  // ─── Canvas ───────────────────────────────────────────────

  function fitCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width  = Math.round(rect.width  * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);

    ctx.strokeStyle = "#21262d";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = Math.round((h / 4) * i) + 0.5;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    if (points.length < 2) return;

    const yFor = (bpm) => {
      const v = Math.max(MIN_BPM, Math.min(MAX_BPM, bpm));
      return h - ((v - MIN_BPM) / (MAX_BPM - MIN_BPM)) * h;
    };
    const xFor = (i) => (i / (MAX_POINTS - 1)) * w;

    ctx.lineWidth = 2;
    ctx.strokeStyle = "#58a6ff";
    ctx.beginPath();
    const offset = Math.max(0, points.length - MAX_POINTS);
    const visible = points.slice(offset);
    visible.forEach((p, i) => {
      const x = xFor(i);
      const y = yFor(p.bpm);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    const last = visible[visible.length - 1];
    ctx.fillStyle = "#e6edf3";
    ctx.beginPath();
    ctx.arc(xFor(visible.length - 1), yFor(last.bpm), 4, 0, Math.PI * 2);
    ctx.fill();
  }

  function pushPoint(bpm) {
    points.push({ bpm, t: performance.now() });
    if (points.length > MAX_POINTS * 2) {
      points.splice(0, points.length - MAX_POINTS);
    }
    setBpm(bpm);
    draw();
  }

  window.addEventListener("resize", fitCanvas);

  // ─── WebSocket ────────────────────────────────────────────

  function connectWS() {
    clearTimeout(wsRetryTimer);
    try {
      ws = new WebSocket(WS_URL);
    } catch (e) {
      console.error("WS create error:", e);
      setStatus("WS ошибка URL", "err");
      wsRetryTimer = setTimeout(connectWS, 3000);
      return;
    }

    ws.onopen = () => {
      console.log("WS connected");
      if (mode === "watch") setStatus("ожидание пульса…", "wait");
    };

    ws.onmessage = (event) => {
      if (mode !== "watch") return;
      try {
        const data = JSON.parse(event.data);
        if (typeof data.bpm === "number") {
          pushPoint(data.bpm);
          setStatus("получено", "on");
        }
      } catch (e) { /* ignore */ }
    };

    ws.onclose = () => {
      console.log("WS closed, reconnecting…");
      if (mode === "watch") setStatus("переподключение…", "err");
      wsRetryTimer = setTimeout(connectWS, 2000);
    };

    ws.onerror = (e) => {
      console.error("WS error:", e);
      if (mode === "watch") setStatus("WS ошибка", "err");
    };
  }

  function sendBpm(bpm) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      try {
        ws.send(JSON.stringify({ bpm }));
      } catch (e) {
        console.error("WS send error:", e);
      }
    }
  }

  // ─── Web Bluetooth ────────────────────────────────────────

  function parseHeartRate(dataView) {
    const flags = dataView.getUint8(0);
    if (flags & 0x01) return dataView.getUint16(1, true);
    return dataView.getUint8(1);
  }

  function onHeartRateChanged(event) {
    try {
      const bpm = parseHeartRate(event.target.value);
      pushPoint(bpm);
      sendBpm(bpm);
    } catch (e) {
      console.error("Parse error:", e);
    }
  }

  async function connectBluetooth() {
    if (mode !== "phone") return;
    if (!navigator.bluetooth) {
      setStatus("Web Bluetooth недоступен", "err");
      return;
    }
    try {
      setStatus("поиск устройства…", "wait");
      btn.disabled = true;

      device = await navigator.bluetooth.requestDevice({
        filters: [{ services: ["heart_rate"] }],
        optionalServices: ["battery_service", "device_information"],
      });

      device.addEventListener("gattserverdisconnected", onDisconnected);

      setStatus("подключение…", "wait");
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService("heart_rate");
      characteristic = await service.getCharacteristic("heart_rate_measurement");

      await characteristic.startNotifications();
      characteristic.addEventListener("characteristicvaluechanged", onHeartRateChanged);

      isConnected = true;
      setStatus("подключено: " + (device.name || "H10"), "on");
      btn.textContent = "Отключить";
      btn.classList.add("disconnect");
      btn.disabled = false;
    } catch (err) {
      console.error(err);
      btn.disabled = false;
      if (err.name === "NotFoundError") {
        setStatus("устройство не выбрано", "");
      } else if (err.name === "SecurityError" || err.name === "NotAllowedError") {
        setStatus("нужен HTTPS", "err");
        alert("Bluetooth заблокирован. Откройте страницу по HTTPS в Chrome.");
      } else {
        setStatus("ошибка: " + err.message, "err");
      }
    }
  }

  async function disconnectBluetooth() {
    try {
      if (characteristic) {
        characteristic.removeEventListener("characteristicvaluechanged", onHeartRateChanged);
        try { await characteristic.stopNotifications(); } catch {}
      }
      if (device && device.gatt && device.gatt.connected) device.gatt.disconnect();
    } catch (e) { console.error(e); }
    onDisconnected();
  }

  function onDisconnected() {
    isConnected = false;
    characteristic = null;
    if (mode === "phone") setStatus("отключено", "err");
    bpmEl.textContent = "--";
    bpmEl.className = "bpm low";
    btn.textContent = "Подключить Polar H10";
    btn.classList.remove("disconnect");
    btn.disabled = false;
  }

  // ─── Wake Lock ────────────────────────────────────────────

  async function requestWakeLock() {
    if (!("wakeLock" in navigator)) {
      console.warn("Wake Lock API не поддерживается");
      return;
    }
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      console.log("Wake Lock активен — экран не гаснет");
    } catch (err) {
      console.warn("Wake Lock не получен:", err.message);
    }
  }

  async function releaseWakeLock() {
    if (wakeLock) {
      try { await wakeLock.release(); } catch (e) {}
      wakeLock = null;
    }
  }

  // ─── Init ─────────────────────────────────────────────────

  fitCanvas();
  connectWS();
  applyModeUI();

  // Wake Lock при первом взаимодействии (браузер требует действие пользователя)
  document.addEventListener("click", () => {
    if (!wakeLock) requestWakeLock();
  }, { once: true });

  // При возврате на страницу — снова захватываем Wake Lock и переподключаем WS
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible") {
      await requestWakeLock();
      if (!ws || ws.readyState === WebSocket.CLOSED) {
        connectWS();
      }
    } else {
      // Страница ушла в фон — освобождаем блокировку (система всё равно заморозит)
      await releaseWakeLock();
    }
  });

  // Попытка сразу (может сработать, если страница уже была активна)
  requestWakeLock();

  btn.addEventListener("click", () => {
    if (isConnected) disconnectBluetooth();
    else connectBluetooth();
  });
})();
</script>
</body>
</html>
